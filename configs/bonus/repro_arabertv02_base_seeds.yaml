# Three-seed reproduction of the frozen AraBERT v02 baseline.
# All model, data, and training values match repro_arabertv02_base.yaml.
model:
  name: aubmindlab/bert-base-arabertv02
  num_labels: 3
  architecture: sequence_classification
  loss: cross_entropy

data:
  train_file: data/splits/arsarcasm_v2/train.csv
  validation_file: data/splits/arsarcasm_v2/validation.csv

training:
  seed: 42
  seeds: [42, 43, 44]
  batch_size: 40
  max_length: 256
  epochs: 10
  mixed_precision: false
  optimizer:
    name: Adam
    learning_rate: 0.00001
    epsilon: 0.00000001
    weight_decay: 0.0
  scheduler: null
  warmup_steps: 0

paths:
  output_dir: checkpoints/bonus/repro_arabertv02_base
  output_dirs:
    42: checkpoints/bonus/repro_arabertv02_base
    43: checkpoints/bonus/repro_arabertv02_base_seed43
    44: checkpoints/bonus/repro_arabertv02_base_seed44
